[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:qemu]
command=/opt/start.sh
autostart=true
autorestart=true
stdout_logfile=/var/log/qemu.log
stderr_logfile=/var/log/qemu_err.log

[program:websockify]
command=websockify --web=/usr/share/novnc 8006 localhost:5900
autostart=true
autorestart=true
