[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=Xvfb :0 -screen 0 1024x768x24
autostart=true
autorestart=true

[program:qemu]
command=/opt/start.sh
autostart=true
autorestart=true
stdout_logfile=/var/log/qemu.log
stderr_logfile=/var/log/qemu_err.log

[program:x11vnc]
command=x11vnc -display :0 -forever -nopw -shared -rfbport 5900
autostart=true
autorestart=true

[program:websockify]
command=websockify --web=/usr/share/novnc 8006 localhost:5900
autostart=true
autorestart=true
